[project]
name = "raven"
version = "0.1.0"
description = "RAVEN — Research and Analysis of Viral and Emerging Niches (Content Radar)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.6,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.15,<1",
    "tenacity>=9.0,<10",
    "openai>=3.0,<4",
    "mcp>=2.0,<3",
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "jinja2>=3.1",
    "markdown-it-py>=3.0",
    "python-multipart>=0.0.20",
]

[project.scripts]
raven = "raven.cli:app"

[dependency-groups]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=1.0",
    "respx>=0.23",
    "ruff>=0.17",
    "mypy>=2.0",
    "types-PyYAML",
    "httpx>=0.28",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/raven"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: chama APIs reais; exige credenciais (pulado por padrão)"]
addopts = "-m 'not live'"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "UP046", "UP047"]

[tool.ruff.lint.per-file-ignores]
# Tabelas Markdown e mensagens ao operador: quebrar as strings prejudica a leitura.
"src/raven/benchmark/report.py" = ["E501"]
"src/raven/pipeline/dossier.py" = ["E501"]
"src/raven/pipeline/investigate.py" = ["E501"]
"src/raven/cli.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "src"
