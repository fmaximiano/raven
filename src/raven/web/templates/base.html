<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
{% if job %}<meta http-equiv="refresh" content="15">{% endif %}
<title>{% block title %}RAVEN{% endblock %}</title>
<style>
:root {
  --bg: #f7f7f5; --surface: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e1dc;
  --accent: #2f5d8a; --accent-text: #ffffff; --warn-bg: #fff4d6; --warn-text: #6b4e00;
  --ok: #1f7a4d; --err: #b3261e; --code: #f0efeb;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #161615; --surface: #1f1f1d; --text: #ecebe6; --muted: #a3a29b; --border: #33322f;
    --accent: #7fb0e0; --accent-text: #0e1a26; --warn-bg: #3a2f12; --warn-text: #f3d98b;
    --ok: #6fcf97; --err: #f28b82; --code: #2a2a27;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.55 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background: var(--surface); border-bottom: 1px solid var(--border); }
.wrap { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
header .wrap { display: flex; gap: 20px; align-items: center; min-height: 56px; flex-wrap: wrap; }
header strong { letter-spacing: .08em; }
nav a { color: var(--muted); text-decoration: none; margin-right: 14px; }
nav a:hover { color: var(--text); }
main { padding: 24px 0 64px; }
h1 { font-size: 1.5rem; margin: 0 0 16px; }
h2 { font-size: 1.15rem; margin: 28px 0 10px; }
a { color: var(--accent); }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
.banner { background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 10px 14px; margin-bottom: 16px; }
.table-wrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .92rem; }
th, td { text-align: left; padding: 7px 8px; border-bottom: 1px solid var(--border); vertical-align: top; }
th { color: var(--muted); font-weight: 600; }
.tag { display: inline-block; padding: 1px 8px; border-radius: 99px; font-size: .78rem; border: 1px solid var(--border); color: var(--muted); }
.tag.sim { background: var(--warn-bg); color: var(--warn-text); border-color: transparent; }
.ok { color: var(--ok); } .err { color: var(--err); } .muted { color: var(--muted); }
button, .btn { background: var(--accent); color: var(--accent-text); border: 0; border-radius: 8px; padding: 9px 16px; font: inherit; cursor: pointer; text-decoration: none; display: inline-block; }
button.secondary { background: transparent; color: var(--accent); border: 1px solid var(--border); }
label { display: block; margin: 10px 0 4px; font-weight: 600; }
input[type=text], input[type=number], select, textarea { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--bg); color: var(--text); font: inherit; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 16px; }
.checks label { font-weight: 400; margin: 0; display: flex; gap: 6px; align-items: center; }
.grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 16px; }
.doc { overflow-wrap: anywhere; }
.doc table { display: block; overflow-x: auto; }
.doc blockquote { margin: 0 0 16px; background: var(--warn-bg); color: var(--warn-text); border-radius: 8px; padding: 8px 14px; }
.doc blockquote p { margin: 4px 0; }
code { background: var(--code); padding: 1px 5px; border-radius: 4px; }
.hint { color: var(--muted); font-size: .88rem; margin: 4px 0 0; }
</style>
</head>
<body>
<header><div class="wrap">
  <strong>RAVEN</strong>
  <nav><a href="/">Execuções</a><a href="/novo">Nova execução</a><a href="/fontes">Fontes</a><a href="/custos">Custos</a></nav>
</div></header>
<main><div class="wrap">
{% if job %}<div class="banner">Em execução: <strong>{{ job.kind }}</strong> desde {{ job.started_at.strftime('%H:%M:%S') }} UTC. Esta página se atualiza sozinha.</div>{% endif %}
{% block content %}{% endblock %}
</div></main>
</body>
</html>
